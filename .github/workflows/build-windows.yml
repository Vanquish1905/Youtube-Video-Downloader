name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (leave empty to only build)"
        required: false
        default: "v3.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DENO_VERSION: v2.9.8

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Download Deno
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/denoland/deno/releases/download/$env:DENO_VERSION/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath . -Force
          .\deno.exe --version

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Get-ChildItem ffmpeg_tmp -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination ffmpeg
          .\ffmpeg\ffmpeg.exe -version | Select-Object -First 1

      - name: Prepare icon
        # Same artwork as icon.ico, saved with every size Windows uses so it stays sharp.
        run: python -c "from PIL import Image; Image.open('icon.ico').convert('RGBA').save('app.ico', sizes=[(16,16),(20,20),(24,24),(32,32),(40,40),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build single exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name VanquishDownloader
          --icon app.ico
          --add-data "app.ico;."
          --add-binary "deno.exe;."
          --add-binary "ffmpeg/ffmpeg.exe;ffmpeg"
          --add-binary "ffmpeg/ffprobe.exe;ffmpeg"
          --collect-all customtkinter
          --collect-all yt_dlp_ejs
          main.py

      - name: Build portable folder
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --name VanquishDownloader
          --distpath dist-portable
          --icon app.ico
          --add-data "app.ico;."
          --add-binary "deno.exe;."
          --add-binary "ffmpeg/ffmpeg.exe;ffmpeg"
          --add-binary "ffmpeg/ffprobe.exe;ffmpeg"
          --collect-all customtkinter
          --collect-all yt_dlp_ejs
          main.py

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive dist-portable/VanquishDownloader/* VanquishDownloader-portable.zip
          Get-Item dist/VanquishDownloader.exe, VanquishDownloader-portable.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: VanquishDownloader-windows
          path: |
            dist/VanquishDownloader.exe
            VanquishDownloader-portable.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          name: Vanquish Downloader ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: .github/release-notes.md
          files: |
            dist/VanquishDownloader.exe
            VanquishDownloader-portable.zip
